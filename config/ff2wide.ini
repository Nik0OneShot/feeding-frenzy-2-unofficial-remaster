; FF2 Remaster settings
[ff2wide]
; Game width in pixels at 600 tall. 0 = match your monitor's shape (3440x1440 -> 1434).
; Set to 800 for the original 4:3 picture.
width=0

; Frame rate cap. 0 = match your monitor's refresh rate (e.g. 165). The original is 60.
; Game speed doesn't change with this; only smoothness does.
fps=0

; How far the fish moves for each pixel your mouse moves (your Windows pointer speed and
; acceleration still apply). 1.0 = one game pixel per screen pixel, like the original on a
; monitor at the game's resolution. Raise it for faster steering, lower it for finer control.
mouse_sensitivity=1.0

; Co-op: also switchable in the game's Options screen (takes effect from the next level).
; 1 = up to 4 players on this PC, and up to 10 with online guests (see online= below).
; Player 1 uses the mouse; everyone else joins during a level by pressing a button on a
; device nobody has yet, and keeps it until the game is closed:
;   a gamepad          - A, B, X, Y or Start to join; left stick, A to dash, B for special
;   a keyboard's left  - W A S D, Space to dash, E or Left Shift for special
;   a keyboard's right - the arrow keys, Right Ctrl to dash, Enter for special
;   another mouse      - click to join; it steers and clicks like player 1's
; Each keyboard plugged in has both sets, so two keyboards make room for four players.
; Each online guest joins as the next player when they connect. In co-op, Space no longer
; pauses; P and Esc still do.
coop=0
; How fast a fish is steered by a stick / keys (game pixels per second).
coop_pad_speed=700
; Players 2 to 10's fish are tinted with these colors (red,green,blue, 0-255) so you can tell
; them apart. The Options screen's color buttons cycle players 2 to 4's through nine presets.
coop_p2_color=255,140,90
coop_p3_color=110,240,110
coop_p4_color=100,150,255
coop_p5_color=255,120,210
coop_p6_color=255,225,80
coop_p7_color=185,120,255
coop_p8_color=80,220,255
coop_p9_color=255,85,85
coop_p10_color=150,150,150

; Online co-op: 1 = host a game for up to 9 friends on other PCs, over the internet or your
; own network. They run ff2guest.exe (in this folder: send it to them; they don't need the
; game) and type in your address, which ff2wide.log shows ("online: ... connect to ...").
; Each one's keyboard, gamepad or mouse steers a fish of their own, and they all see and hear
; your game. Co-op switches on by itself when one connects (from the next level). A guest
; who drops out and reconnects gets their own fish back.
online=0
; The UDP port guests connect to; the one after it (47601) carries the guests' controls.
; The game asks your router to forward both to this PC (online_upnp=1); if ff2wide.log
; says that failed, forward both in your router's settings.
; The first time, Windows may ask whether the game may use the network: allow it.
online_port=47600
online_upnp=1
; The picture sent to each guest: kilobits per second of your upload (6000 = 6 Mbit/s), and
; frames per second. Every guest gets their own copy, so your upload needs this much for
; each one (4 guests at 6000 = 24 Mbit/s). Lower both if the guests' pictures stutter.
online_kbps=6000
online_fps=60
