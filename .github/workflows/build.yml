# Builds everything on every push; a tag like v1.0.0 also makes a release with Setup.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc mingw-w64-i686-binutils
      - name: Build
        run: MINGW=/mingw32/bin sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FF2 Remaster Setup
          path: out/FF2 Remaster Setup.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/FF2 Remaster Setup.exe
